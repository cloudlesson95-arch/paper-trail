[project]
name = "pipeline"
version = "0.1.0"
description = "Offline pipeline for Paper Trail: synthetic documents, OpenCV preprocessing, OCR, NLP and the SQLite build"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "faker>=40.40.0",
    "google-genai>=2.28.0",
    "numpy>=2.5.3",
    "opencv-python-headless<5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "spacy>=3.8.16",
]

[tool.uv]
exclude-newer = "2026-10-04T00:00:00Z"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
